interface=enu1u2
interface=enu1u3
bind-interfaces

# DHCP-only, no DNS
port=0

dhcp-authoritative
dhcp-range=172.20.1.100,172.20.1.200,255.255.255.0,12h
dhcp-range=172.20.2.100,172.20.2.200,255.255.255.0,12h

# Do NOT advertise default route (option 3) or DNS (option 6)
dhcp-option=3
dhcp-option=6

log-dhcp
