[Unit]
# Ensure we wait for the physical device
After=sys-subsystem-net-devices-end0.device
Wants=sys-subsystem-net-devices-end0.device

# Ensure we wait for systemd-networkd to be ready
After=systemd-networkd.service
Wants=systemd-networkd.service

[Service]
# Specifically wait for end0 to be configured/online before starting
ExecStartPre=/lib/systemd/systemd-networkd-wait-online -i end0 --timeout=30
