# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

# Needed due to image.bbclass and logging.bbclass
BBFILES += "${TOPDIR}/source/poky/meta/classes-recipe/*.bbclass"
BBFILES += "${TOPDIR}/source/poky/meta/classes-global/*.bbclass"

# Our own classes
BBFILES += "${LAYERDIR}/classes/*.bbclass"

BBFILE_COLLECTIONS += "meta-belaybox"
BBFILE_PATTERN_meta-belaybox = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-belaybox = "99"

# absolute path of this layer, for files that image recipes reference directly
BELAYBOX_LAYERDIR := "${LAYERDIR}"

LAYERDEPENDS_meta-belaybox = "meta-everest"
LAYERSERIES_COMPAT_meta-belaybox = "wrynose"

SCRIPTS_PATH = "${LAYERDIR}/scripts"

GIT_REPOSITORY_URL ?= "git://git@github.com/PionixPro"
PREFIX_GIT_REPOSITORY ?= ""

# Cloud connector
# TODO: put this somewhere else
# cloud connector, TODO: only activate if feature enabled
CLOUDCONNECTOR_CONFIG_FILE ?= "${LAYERDIR}/recipes-cloudconnector/cloud-connector-configs/cloud-connector-template.yaml"
DISTRO_FEATURES:append = " polkit "

# RAUC compatible per product, used by the image (/usr/lib/rauc/system.conf) and
# its bundle, so a device only accepts bundles of its own product.
# Overridable in local.conf.
BELAYBOX_RAUC_COMPATIBLE ?= "Belaybox"
UMWCHARGER_RAUC_COMPATIBLE ?= "uMWCharger"

# meta-pionix-cloud v0.5.1 only declares kirkstone and scarthgap. Its recipes
# are made wrynose compatible by the bbappends in recipes-core/wrynose-fixes
# (oras-native, cloudconnector). layer.conf of every layer is parsed before
# LAYERSERIES_COMPAT is evaluated, so appending from here is effective.
LAYERSERIES_COMPAT_meta-pionix-cloud:append = " wrynose"
