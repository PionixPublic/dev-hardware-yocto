# uMWCharger: pionix-control selects the config through
# /etc/everest/everest_environment.env and restarts the unit over D-Bus as
# everest-control.service, an alias of everest.service (symlink next to it).
# Start limits, delay and the default env file are taken over from upstream
# pionix-control's everest-control.service. The env file lives in the /etc
# overlay shared by both slots, so only this target reads it.
[Unit]
StartLimitIntervalSec=120s
StartLimitBurst=2

[Service]
RestartSec=10s
EnvironmentFile=-/etc/everest/everest_environment.env
ExecStartPre=/bin/sh -c 'if [ ! -s /etc/everest/everest_environment.env ]; then echo EVEREST_CONFIG=/etc/everest/custom_configs/1_CCS_DIN_SPEC_70121-offline.yaml > /etc/everest/everest_environment.env; fi'
