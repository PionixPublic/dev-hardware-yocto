settings:
  telemetry_enabled: true
  mqtt_broker_socket_path: /tmp/mosquitto.socket
active_modules:
  system:
    module: Linux_Systemd_Rauc
    connections:
      store:
        - module_id: persistent_store
          implementation_id: main
  persistent_store:
    config_module:
      sqlite_db_file_path: everest_persistent_store.db
    connections: {}
    module: PersistentStore
  setup:
    config_module:
      initialized_by_default: true
      localization: true
      online_check_host: lfenergy.org
      setup_simulation: true
      setup_wifi: false
    connections:
      store:
        - implementation_id: main
          module_id: persistent_store
    module: Setup

x-module-layout: {}
