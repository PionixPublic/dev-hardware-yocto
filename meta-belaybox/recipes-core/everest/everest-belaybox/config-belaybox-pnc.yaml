settings:
  telemetry_enabled: true
  mqtt_broker_socket_path: /tmp/mosquitto.socket
active_modules:
  api:
    connections:
      evse_manager:
      - implementation_id: evse
        module_id: evse_manager
    module: API
  auth:
    module: Auth
    config_module:
      connection_timeout: 120
      selection_algorithm: PlugEvents
    connections:
      token_provider:
# Dont use the simulated token provider (which would always swipe a token)
#      - module_id: token_provider_1
#        implementation_id: main
#
# This is the token provider for RFID
        - module_id: token_provider_rfid
          implementation_id: main
# This it the token provider for remote start from csms
        - module_id: ocpp
          implementation_id: auth_provider
# This is the token provider for PnC
        - module_id: evse_manager
          implementation_id: token_provider
      token_validator:
# dont use the dummy token validator (which would say always yes)
#      - module_id: token_validator
#        implementation_id: main
#
# All validation goes through OCPP csms
      - module_id: ocpp
        implementation_id: auth_validator
      evse_manager:
      - module_id: evse_manager
        implementation_id: evse
  energy_manager:
    connections:
      energy_trunk:
      - implementation_id: energy_grid
        module_id: grid_connection_point
    module: EnergyManager
  evse_manager:
    config_module:
      ac_enforce_hlc: true
      ac_hlc_enabled: true
      ac_hlc_use_5percent: true
      ac_nominal_voltage: 230
      ac_with_soc: false
      charge_mode: AC
      dbg_hlc_auth_after_tstep: false
      payment_enable_contract: true
      payment_enable_eim: true
      ev_receipt_required: false
      has_ventilation: true
# Allow PnC
      payment_enable_contract: true
# Allow EIM
      payment_enable_eim: true
# Disable Autocharge
      enable_autocharge: false
      session_logging: true
      session_logging_path: /tmp/logs
      session_logging_xml: false
      connector_id: 1
      external_ready_to_start_charging: true
    connections:
      bsp:
      - implementation_id: board_support
        module_id: yeti_driver
      hlc:
      - implementation_id: charger
        module_id: iso15118_charger
      powermeter_grid_side:
      - implementation_id: powermeter
        module_id: yeti_driver
      slac:
      - implementation_id: main
        module_id: slac
    module: EvseManager
    telemetry:
      id: 1
  grid_connection_point:
    config_module:
      fuse_limit_A: 40
      phase_count: 3
    connections:
      energy_consumer:
      - implementation_id: energy_grid
        module_id: evse_manager
    module: EnergyNode
  iso15118_charger:
    config_module:
      device: eth1
      tls_security: allow
      verify_contract_cert_chain: true
    connections: {}
    module: EvseV2G
    connections:
      security:
        - module_id: evse_security
          implementation_id: main
  persistent_store:
    module: PersistentStore
    config_module:
      sqlite_db_file_path: /etc/everest/everest_persistent_store.db
    connections: {}
  setup:
    config_module:
      localization: true
      setup_simulation: false
      setup_wifi: true
    connections:
      store:
      - module_id: persistent_store
        implementation_id: main
    module: Setup
  slac:
    config_implementation:
      main:
        device: eth1
        do_chip_reset: true
        link_status_detection: true
    connections: {}
    module: EvseSlac
  token_provider_1:
    config_implementation:
      main:
        timeout: 10
        token: DEADBEEF
        type: RFID
    connections:
      evse:
      - implementation_id: evse
        module_id: evse_manager
    module: DummyTokenProvider
  token_provider_rfid:
    config_implementation:
      main:
        serial_port: /dev/ttyAMA5
    connections: {}
    module: PN532TokenProvider
  token_validator:
    config_implementation:
      main:
        sleep: 0.25
        validation_reason: Token seems valid
        validation_result: Accepted
    connections: {}
    module: DummyTokenValidator
  yeti_driver:
    telemetry:
      id: 1
    config_module:
      baud_rate: 115200
      reset_gpio: 27
      serial_port: /dev/ttyAMA0
    connections: {}
    module: YetiDriver
  system:
    module: Linux_Systemd_Rauc
    config_module:
      RebootCommand: /usr/sbin/tryboot
    connections:
      store:
      - module_id: persistent_store
        implementation_id: main
  ocpp:
    module: OCPP
    config_module:
      ChargePointConfigPath: /etc/everest/ocpp16-pnc-config.json
      PublishChargingScheduleIntervalS: 0
    connections:
      evse_manager:
        - module_id: evse_manager
          implementation_id: evse
      reservation:
        - module_id: auth
          implementation_id: reservation
      auth:
        - module_id: auth
          implementation_id: main
      system:
        - module_id: system
          implementation_id: main
      security:
        - module_id: evse_security
          implementation_id: main
  evse_security:
    module: EvseSecurity
    config_module:
      secc_leaf_key_directory: /etc/everest/certs/client/cso
      secc_leaf_cert_directory: /etc/everest/certs/client/cso
      v2g_ca_bundle: /etc/everest/certs/ca/v2g/V2G_ROOT_CA.pem
