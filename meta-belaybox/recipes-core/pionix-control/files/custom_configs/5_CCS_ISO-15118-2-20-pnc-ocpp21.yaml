settings:
  telemetry_enabled: false
active_modules:
  sniffer:
    module: PacketSniffer
    config_module:
      device: eth1
      session_logging_path: ""
    connections:
      evse_manager:
        - implementation_id: evse
          module_id: connector_1
  auth:
    config_module:
      connection_timeout: 60
      prioritize_authorization_over_stopping_transaction: true
      selection_algorithm: FindFirst
      ignore_connector_faults: true
    connections:
      evse_manager:
        - implementation_id: evse
          module_id: connector_1
      token_provider:
        - implementation_id: token_provider
          module_id: connector_1
      token_validator:
        - implementation_id: auth_validator
          module_id: ocpp
    module: Auth
  energy_manager:
    config_module:
      switch_3ph1ph_while_charging_mode: Never
      schedule_interval_duration: 60
      schedule_total_duration: 10
      debug: false
    connections:
      energy_trunk:
        - implementation_id: energy_grid
          module_id: grid_connection_point
    module: EnergyManager
  connector_1:
    mapping:
      module:
        evse: 1
    config_module:
      ac_enforce_hlc: true
      ac_hlc_enabled: true
      ac_hlc_use_5percent: true
      ac_nominal_voltage: 230
      charge_mode: DC
      connector_id: 1
      ev_receipt_required: false
      evse_id: DE*PNX*E12345*1
      has_ventilation: true
      payment_enable_contract: true
      payment_enable_eim: true
      session_logging: true
      session_logging_path: /var/everest-logs/session
      session_logging_xml: false
      logfile_suffix: 5_ISO-2-20-PNC-OCPP21_session_uuid
      switch_3ph1ph_delay_s: 5
      switch_3ph1ph_cp_state: X1
      cable_check_wait_below_60V_before_finish: false
      hack_allow_bpt_with_iso2: true
      external_ready_to_start_charging: true
    connections:
      bsp:
        - implementation_id: board_support
          module_id: cb_bsp
      powermeter_car_side:
        - implementation_id: powermeter
          module_id: cb_bsp
      hlc:
        - implementation_id: charger
          module_id: iso15118_charger
      slac:
        - implementation_id: main
          module_id: slac
      powersupply_DC:
        - module_id: cb_bsp
          implementation_id: dc_supply
      imd:
        - module_id: iso_monitor
          implementation_id: main
    module: EvseManager
    telemetry:
      id: 1
  iso_monitor:
    module: IMDSimulator
  grid_connection_point:
    mapping:
      module:
        evse: 0
    config_module:
      fuse_limit_A: 16
      phase_count: 3
    connections:
      powermeter:
        - implementation_id: powermeter
          module_id: cb_bsp
      energy_consumer:
        - implementation_id: energy_grid
          module_id: external_limits_ocpp
    module: EnergyNode
  external_limits_node:
    mapping:
      module:
        evse: 1
    config_module:
      fuse_limit_A: 16
      phase_count: 3
    connections:
      energy_consumer:
        - implementation_id: energy_grid
          module_id: connector_1
    module: EnergyNode
  external_limits_ocpp:
    mapping:
      module:
        evse: 1
    config_module:
      fuse_limit_A: 16
      phase_count: 3
    connections:
      energy_consumer:
        - implementation_id: energy_grid
          module_id: external_limits_node
    module: EnergyNode
  iso15118_charger:
    config_module:
      device: eth1
      tls_negotiation_strategy: ACCEPT_CLIENT_OFFER
      enable_tls_key_logging: true
      tls_key_logging_path: /var/everest-logs
      logging_path: /var/everest-logs/logs-iso20
      supported_ISO15118_20: true
      supported_ISO15118_2: true
      supported_DIN70121: false
      supported_dynamic_mode: true
      supported_scheduled_mode: true
    module: Evse15118D20
    connections:
      security:
        - module_id: evse_security
          implementation_id: main
  ocpp:
    module: OCPPmulti
    config_module:
      Mode: Only2
      # OCPP 2.1 (2.0.1 offered as fallback) configured through the device model component configs:
      # standardized/ is the shipped set, custom/ holds the components adapted for this charge point.
      DeviceModelConfigPath: /etc/everest/custom_configs/ocpp-multi-21/component_config
      DeviceModelDatabasePath: /etc/everest/custom_configs/ocpp-multi-21/db/device_model_storage.db
      EverestDeviceModelDatabasePath: /etc/everest/custom_configs/ocpp-multi-21/db/everest_device_model_storage.db
      CoreDatabasePath: /etc/everest/custom_configs/ocpp-multi-21/db/ocpp2
      MessageLogPath: /var/everest-logs/logs-ocpp
      RequestCompositeScheduleUnit: W
    connections:
      evse_manager:
        - module_id: connector_1
          implementation_id: evse
      extensions_15118:
        - module_id: iso15118_charger
          implementation_id: extensions
      reservation:
        - module_id: auth
          implementation_id: reservation
      auth:
        - module_id: auth
          implementation_id: main
      system:
        - module_id: system
          implementation_id: main
      security:
        - module_id: evse_security
          implementation_id: main
      evse_energy_sink:
        - module_id: grid_connection_point
          implementation_id: external_limits
        - module_id: external_limits_ocpp
          implementation_id: external_limits
  system:
    module: Linux_Systemd_Rauc
    config_module:
      RebootCommand: /usr/sbin/tryboot
    connections:
      store:
        - implementation_id: main
          module_id: persistent_store
  evse_security:
    module: EvseSecurity
    config_module:
      private_key_password: "123456"
      csms_ca_bundle: /etc/everest/certs/ca/csms/CSMS_ROOT_CA.pem
      mf_ca_bundle: /etc/everest/certs/ca/mf/MF_ROOT_CA.pem
      mo_ca_bundle: /etc/everest/certs/ca/mo/MO_ROOT_CA.pem
      v2g_ca_bundle: /etc/everest/certs/ca/v2g/V2G_ROOT_CA.pem
      csms_leaf_cert_directory: /etc/everest/certs/client/csms
      csms_leaf_key_directory: /etc/everest/certs/client/csms
      secc_leaf_cert_directory: /etc/everest/certs/client/cso
      secc_leaf_key_directory: /etc/everest/certs/client/cso
  persistent_store:
    config_module:
      sqlite_db_file_path: /etc/everest/custom_configs/everest_persistent_store.db
    connections: {}
    module: PersistentStore
  slac:
    module: EvseSlac
    config_implementation:
      main:
        device: eth1
        do_chip_reset: true
        link_status_detection: true
  cb_bsp:
    connections: {}
    config_module:
      serial_port: /dev/ttyAMA0
    module: MicroMegaWattBSP
  external_limits:
    connections:
      energy_node:
        - implementation_id: external_limits
          module_id: external_limits_node
    config_module:
      cfg_heartbeat_interval_ms: 1000
      cfg_communication_check_to_s: 0
    module: external_energy_limits_consumer_API
  api:
    module: API
    config_module:
      charger_information_file: "/etc/everest/charger_info.yaml"
    connections:
      evse_manager:
        - implementation_id: evse
          module_id: connector_1
  error_history:
    module: ErrorHistory
    config_implementation:
      error_history:
        database_path: /etc/everest/error_history.db
  error_history_api:
    module: error_history_consumer_API
    config_module:
      cfg_heartbeat_interval_ms: 0
      cfg_communication_check_to_s: 0
    connections:
      error_history:
        - implementation_id: error_history
          module_id: error_history
